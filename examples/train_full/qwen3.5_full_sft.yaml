### model
model_name_or_path: /data/hulk/tsk/qwen35-4b-slimqwen-hs-2048-is-8192
trust_remote_code: true

## KD param
use_kd_loss: true
kd_teacher_model: /data/ironman/tsk/hf_cache/qwen_weights
kd_lambda: 1.0
kd_lambda_final: 0.75
kd_temperature: 1.0
kd_teacher_quantization_bit: 8

### method
stage: pt
do_train: true
finetuning_type: full
# deepspeed: examples/deepspeed/ds_z3_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

### dataset
dataset: identity,alpaca_en_demo
template: qwen3_5_nothink
cutoff_len: 512
max_samples: null
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/qwen3.5-4b/full/pt
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

